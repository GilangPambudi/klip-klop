name: Build APK

# Builds the Klip-Klop Android APK in CI (no local Android build needed).
# Runs on every push to `apk` and on manual dispatch.
#
# The release build is signed with the committed keystore (android/key.properties)
# so every APK has the SAME signature — installing over an existing app works
# without uninstalling first.

on:
  push:
    branches: [apk]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Static export of the mobile app (mobile/out). No API routes.
      - name: Build mobile static export
        run: npm run build:mobile

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Copies mobile/out into the Android project and syncs plugins.
      - name: Capacitor sync
        run: npx cap sync android

      # assembleRelease with the committed signing config (stable signature).
      - name: Build APK (release, signed)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: klip-klop-release-apk
          path: android/app/build/outputs/apk/release/*.apk
